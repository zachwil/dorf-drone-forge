name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: node tests/midi.cjs
      - run: npm run package:${{ matrix.platform }}
        working-directory: desktop
      - name: Test packaged Windows application
        timeout-minutes: 2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem release -Filter 'Dorf Drone Forge.exe' -Recurse | Select-Object -First 1
          $process = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput smoke.log -RedirectStandardError smoke-error.log
          Get-Content smoke.log
          Get-Content smoke-error.log
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Select-String -Path smoke.log -Pattern 'DORF_SMOKE')) { throw 'Missing smoke test result' }
      - name: Test packaged Linux application
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          xvfb-run -a release/Dorf-Drone-Forge-*-linux-x64/dorf-drone-forge --smoke-test --smoke-test-allow-missing-midi | tee smoke.log
          grep -q DORF_SMOKE smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: dorf-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dorf-*
          merge-multiple: true
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt --title "Dorf Drone Forge $GITHUB_REF_NAME" --notes-file ../.github/release-notes.md --verify-tag
